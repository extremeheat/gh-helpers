name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Use latest Node.js
      uses: actions/setup-node@v7
      with:
        node-version: latest
    - name: Expose GitHub Runtime
      uses: crazy-max/ghaction-github-runtime@v3
    - run: npm install
    - run: npm test
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}